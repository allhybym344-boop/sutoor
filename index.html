<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصطفى المهندس | البوابة الرسمية للمشاريع</title>
    <!-- استيراد الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* خلفية بتدرج زيتوني أخضر هادئ وراقي جداً */
            background: radial-gradient(circle at center, #243026 0%, #121813 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(28, 38, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(143, 169, 133, 0.25);
            border-radius: 28px;
            padding: 45px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-container {
            position: relative;
            margin: 0 auto 20px auto;
            width: 105px;
            height: 105px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a3b899; /* زيتوني فاتح مائل للخضرة الطبيعية */
            background-color: #1c261e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #a3b899;
            box-shadow: 0 0 25px rgba(163, 184, 153, 0.3);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(163, 184, 153, 0.2); }
            100% { box-shadow: 0 0 35px rgba(163, 184, 153, 0.45); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 15px;
            color: #bce1b2; /* أخضر زيتوني فاتح ومشرق يريح العين */
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.bio {
            font-size: 13.5px;
            color: #c2d0bc; /* أبيض زيتي هادئ ومتطور */
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(163, 184, 153, 0.2);
            padding: 16px 22px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background: rgba(163, 184, 153, 0.15);
            border-color: #a3b899;
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
        }

        .link-card .icon-title {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
            font-size: 15px;
            color: #f0f4ee;
        }

        .link-card i.fa-brands, .link-card i.fa-solid {
            font-size: 20px;
            color: #a3b899;
            transition: transform 0.3s ease;
        }

        .link-card:hover i.fa-brands, .link-card:hover i.fa-solid {
            transform: scale(1.15);
        }

        .link-card .arrow-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .link-card .fa-arrow-left {
            font-size: 13px;
            color: #c2d0bc;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            background: #a3b899;
        }

        .link-card:hover .fa-arrow-left {
            transform: translateX(-4px);
            color: #121813;
        }

        footer {
            margin-top: 35px;
            font-size: 12px;
            color: #8fa985;
            border-top: 1px solid rgba(163, 184, 153, 0.12);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أيقونة الملف الشخصي المتوهجة باللون الزيتوني الفاتح المائل للخضرة -->
        <div class="profile-container">
            <div class="profile-img">
                <i class="fa-solid fa-code"></i>
            </div>
        </div>
        
        <h1>مصطفى المهندس</h1>
        <p class="subtitle">مطور برمجيات وتطبيقات موبايل</p>
        <p class="bio">بوابتك الرسمية لاستعراض وتحميل أحدث التطبيقات والمشاريع البرمجية المبتكرة</p>

        <!-- قائمة الروابط -->
        <div class="links-list">
            <!-- تطبيق سُطور -->
            <a href="https://drive.google.com/uc?export=download&id=1U0FvaYKdTVa5qttPFpwnJrp0qQGy7jxR" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>تطبيق سُطور (Sutoor) - APK</span>
                </div>
                <div class="arrow-icon">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
            </a>

            <!-- تطبيق وزاري باث -->
            <a href="#" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>تطبيق وزاري باث (WizariPath)</span>
                </div>
                <div class="arrow-icon">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
            </a>

            <!-- قناتك على يوتيوب -->
            <a href="https://www.youtube.com" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-brands fa-youtube"></i>
                    <span>القناة التعليمية على يوتيوب</span>
                </div>
                <div class="arrow-icon">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
            </a>
        </div>

        <footer>
            جميع الحقوق محفوظة لـ مصطفى المهندس &copy; 2026
        </footer>
    </div>

</body>
</html>
